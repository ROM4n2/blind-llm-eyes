listen: "127.0.0.1:8790"
upstream:
  base_url: "https://api.deepseek.com/anthropic"   # 纯文本上游 Anthropic 兼容端点
  api_key: "sk-deepseek-placeholder"               # 可选：填了就用这个 key 转发，覆盖客户端传来的 Authorization
vision:
  base_url: "https://api.xiaomimimo.com/anthropic"  # MiMo Anthropic 兼容端点根路径（客户端会追加 /v1/messages）
  api_key: "sk-mimo-placeholder"
  model: "mimo-v2.5"                                # 有视觉的那个（opus 等级）
  timeout: "60s"
  description_cap: 1000                            # max_tokens；thinking 已禁用，实测生成 1000-1300 chars，1000 足够
  # ── P5 上下文感知描述（默认 3 轮 / 2000 字） ──
  context_rounds: 3                                # 最近 N 轮对话传给 vision provider。0/不写 → 默认 3；写 -1 → 显式禁用
  context_max_chars: 2000                          # 上下文最大字符数（约 500 tokens），超出时整轮次截断早期对话，保留最新
cache:
  # ── 缓存类型（v1.1.0 新增） ──
  # type: lru            # 默认；纯内存 LRU，重启后描述丢失，零外部依赖
  # type: twotier         # 两层缓存：内存 LRU 热层 + SQLite 冷层，描述跨重启存活
  # 不配置 type 或留空 → 默认 lru（向后兼容 v1.0.x）
  max_entries: 500                                  # LRU 热层容量（type=lru 时为总容量）
  # db_path: ./cache.db             # SQLite 冷层路径（仅 type=twotier 生效）；空→./cache.db
  # sqlite_max_entries: 10000       # SQLite 冷层容量上限；<=0→10000
  # sqlite_ttl: "720h"              # SQLite 冷层条目 TTL；空=不限（建议 30 天 = 720h）
concurrency_limit: 6                                # 单请求内并发 vision 调用上限（errgroup.SetLimit），覆盖典型 2-6 图场景；也作为 adaptive 的初始值
# 自适应并发控制（默认关闭）。开启后会根据 MiMo 实际响应时间在 [min_limit, max_limit]
# 区间内动态调整 concurrency_limit。关闭时完全使用上面的静态 concurrency_limit 值。
# 算法：AIMD 风格 — P90 延迟低于 fast_threshold 时 +increase_step；高于 slow_threshold
# 或错误率 > error_threshold 时 ×decrease_ratio；中间滞回区不调整。
# 参数基于 2026-08-12 生产冒烟测试调优（详见 SMOKE_TEST_REPORT.md）：
#   - MiMo 均值 7.7s < fast_threshold 8s，concurrency_limit 从 4 提至 6
#   - MiMo 最差 20.6s，max_limit 从 16 降至 12 避免压垮
#   - sample_window 20→10，评估周期从 4 分钟缩短至 2 分钟
#   - cooldown_ms 3000→2000，更快响应延迟波动
adaptive_concurrency:
  enabled: false                      # 生产验证后再改为 true
  min_limit: 1                        # 降并发地板（至少 1 路）
  max_limit: 12                       # 升并发天花板（2× 默认值）
  fast_threshold_ms: 8000             # P90 < 8s → 认为有升并发空间
  slow_threshold_ms: 15000            # P90 > 15s → 认为过载，降并发
  sample_window: 10                   # 滚动窗口样本数（~10 次 vision 调用评一次）
  cooldown_ms: 2000                   # 两次调整之间的最小间隔（防抖动）
  increase_step: 1                    # 每次升并发 +N
  decrease_ratio: 0.75                # 每次降并发 ×ratio（0.75 = 降 25%）
  error_threshold: 0.10               # 错误率 > 10% → 触发降并发
fail_open: true                                     # 视觉失败 → 替换为占位文字，不阻塞主链路
log_level: "info"                                   # debug / info / warn / error

# ── 视觉能力模型白名单（v1.0.1 新增） ──
# 列出上游已原生支持图片输入的模型名。请求的 model 匹配此列表时（大小写不敏感，
# 在去除 [1m] 等后缀之后匹配），代理跳过图片改写阶段，直接透传请求体——节省一次
# vision API 调用和约 8s 延迟。留空或不配置 = 总是改写（默认行为）。
# vision_capable_models:
#   - "gpt-4o"
#   - "gpt-4o-2024-08-06"
#   - "claude-3-5-sonnet-20241022"

# ────────────────────────────────────────────────────────────────────────────
# 多 Vision Provider 池（P3 新增，可选）
# 启用后覆盖上方 vision 字段；池按 priority 升序遍历 provider，失败自动故障转移。
# 每个 provider 配备独立的熔断器：连续失败达 failure_threshold 后开启，
# 经过 reset_timeout 后进入半开态放行一个试探请求。
#
# 支持的 type:
#   - "mimo"              = Anthropic Messages API 格式
